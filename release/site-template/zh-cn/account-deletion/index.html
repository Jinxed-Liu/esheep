<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>删除 eSheep+ 账号</title><link rel="stylesheet" href="../../assets/site.css"></head><body><main><h1>删除账号</h1><ol><li>先导出需要保留的数据。</li><li>如果你仍是牧场主，转移所有权或删除牧场。</li><li>在 App 的账户设置中选择“删除账号”，重新认证并完成系统生物识别确认。</li><li>保存删除任务编号。无所有权阻塞后，目标为 24 小时内完成。</li></ol><p>遇到问题请联系 <a href="mailto:support@{{DOMAIN}}">support@{{DOMAIN}}</a>。</p></main></body></html>
