name: iOS runtime regression

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'eSheepNext/**'
      - 'eSheepNextTests/**'
      - 'eSheepNextUITests/**'
      - 'eSheepNext.xcodeproj/**'
      - '.github/workflows/ios-runtime.yml'
  push:
    branches: [main, 'codex/**']
    paths:
      - 'eSheepNext/**'
      - 'eSheepNextTests/**'
      - 'eSheepNextUITests/**'
      - 'eSheepNext.xcodeproj/**'
      - '.github/workflows/ios-runtime.yml'

permissions:
  contents: read

concurrency:
  group: ios-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assistant-entry:
    runs-on: macos-26
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Select stable Xcode and simulator
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
          python3 - <<'PY'
          import json, os, subprocess
          sdk_version = tuple(map(int, subprocess.check_output(
              ['xcrun', '--sdk', 'iphonesimulator', '--show-sdk-version'], text=True
          ).strip().split('.')))
          with open(os.path.join(os.environ['RUNNER_TEMP'], 'simulators.json')) as file:
              devices = json.load(file)['devices']
          candidates = [
              (tuple(map(int, runtime.rsplit('iOS-', 1)[1].split('-'))), device)
              for runtime, values in devices.items() if 'iOS-' in runtime
              if tuple(map(int, runtime.rsplit('iOS-', 1)[1].split('-'))) <= sdk_version
              for device in values
              if device.get('isAvailable') and device['name'] == 'iPhone 17 Pro'
          ]
          if not candidates:
              raise SystemExit('The approved stable iPhone simulator is unavailable.')
          version, device = max(candidates, key=lambda entry: entry[0])
          print(f"Testing {device['name']} on iOS {'.'.join(map(str, version))}")
          with open(os.environ['GITHUB_ENV'], 'a') as file:
              file.write(f"IOS_SIMULATOR_ID={device['udid']}\n")
          PY
      - name: Build the assistant entry UI regression
        run: |
          set -euo pipefail
          python3 -u - <<'PY' &
          import os, re, subprocess, time
          from pathlib import Path
          for _ in range(3):
              time.sleep(60)
          processes = subprocess.run(['pgrep', '-x', 'swift-frontend'], capture_output=True, text=True)
          for pid in processes.stdout.split()[:3]:
              command = subprocess.run(['ps', '-p', pid, '-o', 'command='], capture_output=True, text=True).stdout
              print('Compiler diagnostic:', pid, re.findall(r'-primary-file\s+(\S+)', command), flush=True)
              path = Path(os.environ['RUNNER_TEMP']) / f'compiler-{pid}.sample'
              subprocess.run(['sample', pid, '1', '-file', str(path)], check=False)
              if path.exists():
                  print(path.read_text()[:12000], flush=True)
          PY
          compiler_monitor_pid=$!
          trap 'kill "$compiler_monitor_pid" 2>/dev/null || true' EXIT
          xcodebuild build-for-testing \
            -project eSheepNext.xcodeproj \
            -scheme eSheepNextUI \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/ios-derived-data" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES SWIFT_ENABLE_BATCH_MODE=NO \
            'OTHER_SWIFT_FLAGS=$(inherited) -Xfrontend -solver-expression-time-threshold=30 -Xfrontend -warn-long-expression-type-checking=500' \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/assistant-build.log"
      - name: Run the real assistant entry UI regression
        run: |
          set -euo pipefail
          xcodebuild test-without-building \
            -project eSheepNext.xcodeproj \
            -scheme eSheepNextUI \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/ios-derived-data" \
            -resultBundlePath "$RUNNER_TEMP/assistant-entry.xcresult" \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 180 \
            -maximum-test-execution-time-allowance 180 \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES SWIFT_ENABLE_BATCH_MODE=NO \
            'OTHER_SWIFT_FLAGS=$(inherited) -Xfrontend -solver-expression-time-threshold=30 -Xfrontend -warn-long-expression-type-checking=500' \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/assistant-entry.log"
      - name: Print runtime result and crash details
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/assistant-entry.xcresult" ]; then
            xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/assistant-entry.xcresult" || true
          fi
          if [ -d "$RUNNER_TEMP/ios-unit.xcresult" ]; then
            xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/ios-unit.xcresult" || true
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          decoder = json.JSONDecoder()
          for path in Path.home().joinpath('Library/Logs/DiagnosticReports').glob('eSheep*.ips'):
              raw = path.read_text()
              header, end = decoder.raw_decode(raw)
              payload = decoder.raw_decode(raw[end:].lstrip())[0]
              print(f'Crash report: {path.name}')
              print(json.dumps({
                  'exception': payload.get('exception'),
                  'termination': payload.get('termination'),
                  'asi': payload.get('asi'),
                  'faultingThread': payload.get('faultingThread'),
                  'threads': [thread for thread in payload.get('threads', []) if thread.get('triggered')],
                  'usedImages': payload.get('usedImages'),
              }, indent=2))
          PY
      - name: Preserve test evidence and crash reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assistant-entry-${{ github.sha }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/assistant-build.log
            ${{ runner.temp }}/assistant-entry.log
            ${{ runner.temp }}/assistant-entry.xcresult
            ${{ runner.temp }}/ios-unit.log
            ${{ runner.temp }}/ios-unit.xcresult
            ${{ runner.temp }}/compiler-*.sample
            ~/Library/Logs/DiagnosticReports/*.ips
            ~/Library/Logs/DiagnosticReports/*.crash
