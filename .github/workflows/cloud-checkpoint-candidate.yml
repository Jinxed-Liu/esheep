name: Cloud checkpoint candidate
on:
  workflow_dispatch:
  schedule:
    - cron: '15 18 * * *'
permissions:
  contents: read
concurrency:
  group: cloud-checkpoint-candidate
  cancel-in-progress: false
jobs:
  candidate:
    # Use a reviewed, ephemeral Apple silicon worker; never install a service.
    # The environment admits main only and requires the owner review.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    runs-on: [self-hosted, macOS, ARM64, esheep-checkpoints]
    environment: esheep-cloud-checkpoints
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        id: checkout
        with:
          path: eSheepNext
          persist-credentials: false
      - name: Build and independently reconcile candidate
        id: candidate
        working-directory: eSheepNext
        env:
          # Ordinary env values appear in public step headers. Keep the entire
          # configuration masked, and never echo parsed fields or exceptions.
          ESHEEP_CHECKPOINT_WORKER_CONFIG: ${{ secrets.ESHEEP_CHECKPOINT_WORKER_CONFIG }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.ESHEEP_CHECKPOINT_SOURCE_TOKEN }}
        run: |
          umask 077
          python3 tools/run_esheep_checkpoint_candidate.py
      - name: Record non-business verification outcome
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        working-directory: eSheepNext
        env:
          ESHEEP_CHECKPOINT_WORKER_CONFIG: ${{ secrets.ESHEEP_CHECKPOINT_WORKER_CONFIG }}
          CHECKPOINT_STEP_OUTCOME: ${{ steps.candidate.outcome }}
        run: |
          python3 tools/run_esheep_checkpoint_candidate.py --summary-only
