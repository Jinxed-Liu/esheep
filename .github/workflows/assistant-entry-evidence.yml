name: Extract assistant entry evidence

on:
  push:
    branches: ['codex/assistant-entry-baseline']
    paths: ['.github/workflows/assistant-entry-evidence.yml']

permissions:
  contents: read
  actions: read

jobs:
  extract:
    runs-on: macos-26
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Download the completed assistant and unit test evidence
        uses: actions/download-artifact@v4
        with:
          name: assistant-entry-f886a7b50e057f14ad8c4b5b01203dee4d003b94
          run-id: 36977439256
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/assistant-entry-original
      - name: Export screenshots and text without rerunning the app
        run: |
          set -euo pipefail
          xcodebuild -version
          python3 -u - <<'PY'
          import json, os, shutil, subprocess, zipfile
          from pathlib import Path

          temp = Path(os.environ['RUNNER_TEMP'])
          source = temp / 'assistant-entry-original'
          output = temp / 'assistant-entry-small'
          exported = temp / 'assistant-entry-exported'
          output.mkdir()
          bundles = list(source.rglob('assistant-entry.xcresult'))
          if len(bundles) != 1:
              raise SystemExit(f'Expected one result bundle, found {len(bundles)}')
          bundle = bundles[0]
          print('Result bundle:', bundle)

          def command(arguments, filename):
              result = subprocess.run(['xcrun', 'xcresulttool', *arguments], capture_output=True, text=True)
              (output / filename).write_text(result.stdout)
              if result.stderr:
                  (output / (filename + '.stderr.txt')).write_text(result.stderr)
              print('xcresulttool', arguments[0:3], 'exit:', result.returncode)
              print((result.stdout + result.stderr)[:12000])
              return result

          command(['export', 'attachments', '--help'], 'export-attachments-help.txt')
          for kind in ['summary', 'tests']:
              command(['get', 'test-results', kind, '--path', str(bundle)], kind + '.json')
          command(['get', 'test-results', 'activities', '--help'], 'activities-help.txt')
          for method in ['testAssistantEntryOpensConversationListAndCanReenter', 'testConfiguredAssistantOpensHistoryAndNewChatComposer']:
              command(['get', 'test-results', 'activities', '--path', str(bundle),
                       '--test-id', f'InsightAssistantEntryUITests/{method}()'], method + '-activities.json')
          command(['export', 'attachments', '--path', str(bundle), '--output-path', str(exported)], 'export-attachments.txt')
          unit_bundles = list(source.rglob('ios-unit.xcresult'))
          if len(unit_bundles) != 1:
              raise SystemExit(f'Expected one unit result bundle, found {len(unit_bundles)}')
          unit_bundle = unit_bundles[0]
          unit_summary = command(['get', 'test-results', 'summary', '--path', str(unit_bundle)], 'ios-unit-summary.json')
          command(['get', 'test-results', 'tests', '--path', str(unit_bundle)], 'ios-unit-tests.json')
          if unit_summary.returncode == 0:
              failures = json.loads(unit_summary.stdout).get('testFailures', [])
              identifiers = sorted({failure['testIdentifierString'] for failure in failures})
              for index, identifier in enumerate(identifiers):
                  command(['get', 'test-results', 'activities', '--path', str(unit_bundle),
                           '--test-id', identifier], f'ios-unit-failure-{index}-activities.json')
          command(['export', 'attachments', '--path', str(unit_bundle), '--output-path', str(exported / 'unit'),
                   '--only-failures'], 'export-unit-failures.txt')
          diagnostics = temp / 'assistant-entry-diagnostics'
          command(['export', 'diagnostics', '--help'], 'export-diagnostics-help.txt')
          command(['export', 'diagnostics', '--path', str(bundle), '--output-path', str(diagnostics)], 'export-diagnostics.txt')

          # Completed result bundles keep diagnostics in archive attachments,
          # unlike the Staging directory of interrupted runs.
          stderr_sources = list(source.rglob('StandardOutputAndStandardError-com.sheepfarm.next.dev.txt'))
          stderr_sources += list(diagnostics.rglob('StandardOutputAndStandardError-com.sheepfarm.next.dev.txt'))
          for archive in diagnostics.rglob('*.zip'):
              with zipfile.ZipFile(archive) as files:
                  for name in files.namelist():
                      if name.endswith('StandardOutputAndStandardError-com.sheepfarm.next.dev.txt'):
                          target = diagnostics / ('unpacked-' + str(len(stderr_sources)) + '.txt')
                          target.write_bytes(files.read(name))
                          stderr_sources.append(target)

          for index, path in enumerate(sorted(set(stderr_sources))):
              target = output / f'app-{index}-stderr.txt'
              raw = path.read_bytes()
              if len(raw) > 12 * 1024 * 1024:
                  notice = f'Evidence truncated: original {len(raw)} bytes, retaining final 12 MiB.\n'.encode()
                  target.write_bytes(notice + raw[-12 * 1024 * 1024:])
              else:
                  target.write_bytes(raw)
              lines = path.read_text(errors='replace').splitlines()
              changes = [line for line in lines if 'FarmInsightConversationListView:' in line]
              (output / f'app-{index}-body-changes.txt').write_text('\n'.join(changes))
              print('App stderr:', path, 'bytes:', path.stat().st_size)
              print('List body changes:', '\n'.join(changes[:100]))
              relevant = [i for i, line in enumerate(lines) if any(token in line for token in
                          ['insight.composer', '聊天菜单', '新聊天', '入口回归历史聊天', 'TextView,', 'TextField,'])]
              print('Relevant accessibility lines:')
              for index in relevant[-100:]:
                  print(f'{index + 1}: {lines[index]}')
          for path in source.rglob('assistant-entry.log'):
              shutil.copy2(path, output / 'assistant-entry.log.txt')
          for path in source.rglob('ios-unit.log'):
              raw = path.read_bytes()
              if len(raw) > 6 * 1024 * 1024:
                  raw = b'Evidence truncated: retaining final 6 MiB of unit log.\n' + raw[-6 * 1024 * 1024:]
              (output / 'ios-unit.log.txt').write_bytes(raw)
              lines = path.read_text(errors='replace').splitlines()
              failures = [line for line in lines if any(token in line for token in ['error:', 'failed', 'Executed ', 'TEST FAILED'])]
              (output / 'ios-unit-failure-lines.txt').write_text('\n'.join(failures))
              print('Unit failure evidence:', '\n'.join(failures[-100:]))

          # XCTest may export snapshots without a file suffix. Convert image
          # snapshots when possible; otherwise preserve a final video frame.
          for path in sorted(exported.rglob('*')):
              if path.is_file() and not path.suffix:
                  kind = subprocess.run(['file', '-b', str(path)], capture_output=True, text=True).stdout
                  print('Unlabelled attachment type:', path.name, kind.strip())
                  if any(token in kind for token in ['PNG image', 'JPEG image', 'HEIF', 'TIFF image']):
                      subprocess.run(['sips', '-s', 'format', 'png', str(path), '--out', str(path) + '.png'], check=True)
          if not any(path.suffix.lower() == '.png' for path in exported.rglob('*')):
              ffmpeg = shutil.which('ffmpeg')
              if not ffmpeg:
                  script = temp / 'export-video-frame.swift'
                  script.write_text('''import AVFoundation
          import AppKit
          import Foundation
          let arguments = CommandLine.arguments
          let asset = AVURLAsset(url: URL(fileURLWithPath: arguments[1]))
          let duration = try await asset.load(.duration)
          let generator = AVAssetImageGenerator(asset: asset)
          generator.appliesPreferredTrackTransform = true
          let time = CMTime(seconds: max(0, CMTimeGetSeconds(duration) - 0.2), preferredTimescale: 600)
          let (image, _) = try await generator.image(at: time)
          guard let data = NSBitmapImageRep(cgImage: image).representation(using: .png, properties: [:]) else {
              throw NSError(domain: "EvidencePNGExport", code: 1)
          }
          try data.write(to: URL(fileURLWithPath: arguments[2]))
          ''')
              for path in sorted(exported.rglob('*.mp4')):
                  if ffmpeg:
                      subprocess.run([ffmpeg, '-hide_banner', '-loglevel', 'error', '-sseof', '-0.1', '-i', str(path),
                                      '-frames:v', '1', str(path.with_suffix('.png'))], check=True)
                  else:
                      subprocess.run(['swift', str(script), str(path), str(path.with_suffix('.png'))], check=True)

          listing = []
          budget = 28 * 1024 * 1024
          total = sum(path.stat().st_size for path in output.rglob('*') if path.is_file())
          for path in sorted(exported.rglob('*')) if exported.exists() else []:
              if not path.is_file():
                  continue
              size = path.stat().st_size
              allowed = path.suffix.lower() in {'.png', '.txt', '.json'}
              copied = allowed and total + size < budget
              relative = path.relative_to(exported)
              listing.append({'path': str(relative), 'bytes': size, 'copied': copied})
              if copied:
                  target = output / 'attachments' / relative
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(path, target)
                  total += size
          (output / 'attachments-list.json').write_text(json.dumps(listing, indent=2))
          print('Exported attachment inventory:', json.dumps(listing, indent=2))
          actual = sum(path.stat().st_size for path in output.rglob('*') if path.is_file())
          print('Reduced evidence total bytes:', actual)
          if actual >= 30 * 1024 * 1024:
              raise SystemExit('Reduced evidence exceeds the download budget')
          if not any(path.suffix.lower() == '.png' for path in output.rglob('*')):
              raise SystemExit('No failure screenshots were exported')
          PY
      - name: Preserve the small screenshots and text evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assistant-entry-f886a7b-small
          if-no-files-found: error
          path: ${{ runner.temp }}/assistant-entry-small
