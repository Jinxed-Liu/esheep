name: iOS compatibility focused checks

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Full acceptance or focused interaction validation
        type: choice
        default: full
        options:
          - full
          - avatar-lifecycle
          - lifecycle-stability
          - postmerge-ui

run-name: iOS compatibility ${{ inputs.scope || 'full' }} (${{ github.ref_name }})

permissions:
  contents: read

concurrency:
  group: ios-gestures-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gestures:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: '17'
            host: macos-15
            xcode: Xcode_26.3
            scheme: eSheepNextUI
          - runtime: '26'
            host: macos-26
            xcode: Xcode_26.6
            scheme: eSheepNextUI
    runs-on: ${{ matrix.host }}
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/${{ matrix.xcode }}.app/Contents/Developer
      COMPATIBILITY_RUNTIME: ${{ matrix.runtime }}
      COMPATIBILITY_SCHEME: ${{ matrix.scheme }}
      COMPATIBILITY_SCOPE: ${{ inputs.scope || 'full' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Prepare the stable simulator
        run: |
          set -euo pipefail
          touch "$RUNNER_TEMP/compatibility-started"
          python3 - <<'PYSCOPE'
          import json, os
          from pathlib import Path
          scope = os.environ['COMPATIBILITY_SCOPE']
          report = {'head': os.environ['GITHUB_SHA'], 'scope': scope,
                    'fullAcceptance': scope == 'full',
                    'unitAndPerformanceRequested': scope == 'full',
                    'expectedUICases': {'full': 7, 'avatar-lifecycle': 2, 'lifecycle-stability': 3, 'postmerge-ui': 10}[scope]}
          (Path(os.environ['RUNNER_TEMP']) / 'compatibility-validation.json').write_text(json.dumps(report, indent=2))
          print(json.dumps(report))
          PYSCOPE
          xcodebuild -version
          xcrun simctl list --json > "$RUNNER_TEMP/simulators.json"
          if [ "$COMPATIBILITY_RUNTIME" = 17 ]; then
            for runtime_download_attempt in 1 2 3; do
              if xcodebuild -downloadPlatform iOS -buildVersion 17.5; then
                break
              fi
              if [ "$runtime_download_attempt" = 3 ]; then exit 1; fi
              xcrun simctl list devices available
            done
          fi
          python3 - <<'PY'
          import json, os, subprocess, sys
          sys.path.insert(0, 'tools')
          import verify_ios_compatibility as gate
          inventory = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', '--json'], text=True))
          sdk = gate.version_tuple(subprocess.check_output(['xcrun', '--sdk', 'iphonesimulator', '--show-sdk-version'], text=True).strip())
          major = int(os.environ['COMPATIBILITY_RUNTIME'])
          runtimes = [r for r in inventory['runtimes'] if r.get('isAvailable') and gate.stable_runtime(r)
                      and r.get('identifier', '').find('.SimRuntime.iOS-') >= 0
                      and gate.version_tuple(r['version'])[0] == major and gate.version_tuple(r['version']) <= sdk]
          if not runtimes: raise SystemExit('The requested stable runtime is unavailable.')
          runtime = max(runtimes, key=lambda r: gate.version_tuple(r['version']))
          model = 'iPhone-15-Pro' if major == 17 else 'iPhone-17-Pro'
          if major == 17 and os.environ['COMPATIBILITY_SCOPE'] == 'postmerge-ui':
              model = 'iPhone-15-Pro-Max'  # Match the failing broad legacy gate.
          udid = subprocess.check_output(['xcrun', 'simctl', 'create', 'eSheep compatibility gestures',
                  'com.apple.CoreSimulator.SimDeviceType.' + model, runtime['identifier']], text=True).strip()
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('IOS_SIMULATOR_ID=' + udid + '\n')
          print('Testing', model, 'iOS', runtime['version'], udid)
          PY
      - name: Build the actual test target
        id: build
        run: |
          set -euo pipefail
          xcodebuild -showTestPlans -project eSheepNext.xcodeproj -scheme eSheepNextUI
          compatibility_build_schemes=(eSheepNextUI)
          if [ "$COMPATIBILITY_SCOPE" = full ]; then
            compatibility_build_schemes+=(eSheepNext)
          fi
          for compatibility_build_scheme in "${compatibility_build_schemes[@]}"; do
            gesture_test_plan_options=(-configuration Debug)
            if [ "$compatibility_build_scheme" = eSheepNextUI ] && [ "$COMPATIBILITY_RUNTIME" = 17 ]; then
              gesture_test_plan_options+=(-testPlan Legacy17)
            fi
            xcodebuild build-for-testing -project eSheepNext.xcodeproj -scheme "$compatibility_build_scheme" \
              -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_ID,arch=arm64" \
              -derivedDataPath "$RUNNER_TEMP/gesture-derived-data" \
              "${gesture_test_plan_options[@]}" \
              ARCHS=arm64 ONLY_ACTIVE_ARCH=YES SWIFT_ENABLE_BATCH_MODE=NO \
              'OTHER_SWIFT_FLAGS=$(inherited) -Xfrontend -solver-expression-time-threshold=30' \
              CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- \
              2>&1 | tee -a "$RUNNER_TEMP/gesture-build.log"
          done
          python3 - <<'PY'
          import json, os, plistlib
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          def policies(value):
              found = {}
              if isinstance(value, dict):
                  for key, child in value.items():
                      if 'RuntimeDiagnosticsPolicy' in key or 'RuntimeIssuesDetectionPolicy' in key:
                          found[key] = child
                      found.update(policies(child))
              elif isinstance(value, list):
                  for child in value: found.update(policies(child))
              return found
          report = {}
          for path in (root / 'gesture-derived-data/Build/Products').glob('*.xctestrun'):
              with path.open('rb') as source: report[path.name] = policies(plistlib.load(source))
          encoded = json.dumps(report, indent=2, default=str)
          (root / 'runtime-diagnostics-policy.json').write_text(encoded)
          print(encoded)
          if os.environ['COMPATIBILITY_RUNTIME'] == '17':
              legacy = [value for name, value in report.items() if '_Legacy17_' in name]
              if len(legacy) != 1:
                  raise SystemExit('Expected exactly one generated Legacy17 test configuration')
              policy = legacy[0].get('RuntimeDiagnosticsPolicy', {})
              main_thread_keys = [key for key in policy if 'MainThreadChecker' in key]
              if len(main_thread_keys) != 1:
                  raise SystemExit('Missing generated Main Thread Checker policy')
              for key in ('XCTOtherRuntimeIssuesDetectionPolicy',
                          'XCTThreadPerformanceCheckerRuntimeIssueDetectionPolicy', *main_thread_keys):
                  if policy.get(key, {}).get('detectionEnabled') is not False:
                      raise SystemExit('Legacy17 runtime diagnostic category was not disabled: ' + key)
          PY
      - name: Run the complete unit and performance suites
        if: ${{ inputs.scope == 'full' }}
        run: |
          set -euo pipefail
          xcrun simctl bootstatus "$IOS_SIMULATOR_ID" -b
          xcodebuild test-without-building -project eSheepNext.xcodeproj -scheme eSheepNext \
            -configuration Debug -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_ID,arch=arm64" \
            -derivedDataPath "$RUNNER_TEMP/gesture-derived-data" \
            -resultBundlePath "$RUNNER_TEMP/full-unit.xcresult" -parallel-testing-enabled NO \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 240 \
            -maximum-test-execution-time-allowance 240 \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- \
            2>&1 | tee "$RUNNER_TEMP/full-unit.log"
      - name: Verify keyboard retention with the real voice controls
        if: ${{ always() && steps.build.outcome == 'success' && inputs.scope == 'full' }}
        run: |
          set -euo pipefail
          gesture_test_plan_options=(-configuration Debug)
          if [ "$COMPATIBILITY_RUNTIME" = 17 ] && [ "$COMPATIBILITY_SCHEME" = eSheepNextUI ]; then
            gesture_test_plan_options+=(-testPlan Legacy17)
          fi
          xcrun simctl bootstatus "$IOS_SIMULATOR_ID" -b
          gesture_test_options=(
            -parallel-testing-enabled NO
            -only-testing:eSheepNextUITests/InsightAssistantEntryUITests/testComposerVoiceControlsKeepDraftAndKeyboard
          )
          xcodebuild test-without-building -project eSheepNext.xcodeproj -scheme "$COMPATIBILITY_SCHEME" \
            -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_ID,arch=arm64" \
            -derivedDataPath "$RUNNER_TEMP/gesture-derived-data" \
            -resultBundlePath "$RUNNER_TEMP/gestures.xcresult" \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 240 \
            -maximum-test-execution-time-allowance 240 \
            "${gesture_test_plan_options[@]}" \
            "${gesture_test_options[@]}" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- \
            2>&1 | tee "$RUNNER_TEMP/gestures.log"
      - name: Run the selected native UI interactions
        if: ${{ always() && matrix.scheme == 'eSheepNextUI' && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          gesture_test_plan_options=(-configuration Debug)
          if [ "$COMPATIBILITY_RUNTIME" = 17 ] && [ "$COMPATIBILITY_SCHEME" = eSheepNextUI ]; then
            gesture_test_plan_options+=(-testPlan Legacy17)
          fi
          # The swipe test uses native content-pop on iOS 26 and native
          # edge-pop on older systems. Exercise both paths on the final head.
          gesture_diagnostic_filters=(
            -only-testing:eSheepNextUITests/PlatformCompatibilityUITests
            -only-testing:eSheepNextUITests/InsightAssistantEntryUITests/testContentSwipeReturnsToListAndKeepsTheReplyRunning
            -only-testing:eSheepNextUITests/InsightAssistantEntryUITests/testFloatingAttachmentPanelPreservesTheDraftAndPresentsTheSelectedAction
            -only-testing:eSheepNextUITests/InsightAssistantEntryUITests/testKnownVoiceTimelineUsesASingleRowAndPreservesTheUnsentDraft
            -only-testing:eSheepNextUITests/InsightAssistantEntryUITests/testBriefBackgroundSwitchPreservesTheRunningReply
            -only-testing:eSheepNextUITests/InsightAssistantEntryUITests/testRepeatedPendingVoiceCancellationPreservesDraftAndKeyboard
          )
          if [ "$COMPATIBILITY_SCOPE" = avatar-lifecycle ]; then
            gesture_diagnostic_filters=(
              -only-testing:eSheepNextUITests/PlatformCompatibilityUITests
              -only-testing:eSheepNextUITests/InsightAssistantEntryUITests/testBriefBackgroundSwitchPreservesTheRunningReply
            )
          fi
          if [ "$COMPATIBILITY_SCOPE" = postmerge-ui ]; then
            gesture_diagnostic_filters=(
              -only-testing:eSheepNextUITests/InsightAssistantEntryUITests/testDelayedLongReviewedReplyAppearsOnTheCurrentPage
              -only-testing:eSheepNextUITests/PenManagementUITests/testManagementEntryCreateEditRetireReactivateAndSafeDelete
              -only-testing:eSheepNextUITests/ReproductionAnalysisUITests/testOccupiedPenSelectorHidesEmptyPenAndKeepsIndividualChoices
              -only-testing:eSheepNextUITests/SheepSharePermissionsUITests/testAdministratorCanSharePosterAndExportSheepArchive
              -only-testing:eSheepNextUITests/SheepSharePermissionsUITests/testOwnerCanSharePosterAndExportSheepArchive
              -only-testing:eSheepNextUITests/SheepSharePermissionsUITests/testWorkerCanSharePosterAndExportSheepArchive
              -only-testing:eSheepNextUITests/SheepSharePosterEditorUITests/testBreedingTextFontGeometryLayersUndoAndReset
              -only-testing:eSheepNextUITests/SheepSharePosterEditorUITests/testCrossStyleTemplateApplicationKeepsTheSavedDesign
              -only-testing:eSheepNextUITests/SheepSharePosterEditorUITests/testNativeColorPickerAndVisibilityAreUndoable
              -only-testing:eSheepNextUITests/SheepSharePosterEditorUITests/testSavedTemplateSurvivesRelaunchAndRebindsEveryCurrentSheepField
            )
          fi
          gesture_result_names=(native-interactions)
          gesture_maximum_seconds=240
          if [ "$COMPATIBILITY_SCOPE" = postmerge-ui ]; then
            # Honor the existing poster cases' explicit 480/600-second budgets,
            # as ios-runtime.yml does. Other cases retain the 240-second default.
            gesture_maximum_seconds=600
          fi
          if [ "$COMPATIBILITY_SCOPE" = lifecycle-stability ]; then
            gesture_diagnostic_filters=(
              -only-testing:eSheepNextUITests/InsightAssistantEntryUITests/testBriefBackgroundSwitchPreservesTheRunningReply
            )
            # Three independent executions, never retry-until-pass. Preserve
            # every result and fail the step if any execution fails.
            gesture_result_names=(native-interactions-1 native-interactions-2 native-interactions-3)
          fi
          xcrun simctl bootstatus "$IOS_SIMULATOR_ID" -b
          gesture_failed=0
          for gesture_result_name in "${gesture_result_names[@]}"; do
            if ! xcodebuild test-without-building -project eSheepNext.xcodeproj -scheme eSheepNextUI \
              -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_ID,arch=arm64" \
              -derivedDataPath "$RUNNER_TEMP/gesture-derived-data" \
              -resultBundlePath "$RUNNER_TEMP/$gesture_result_name.xcresult" -parallel-testing-enabled NO \
              -test-timeouts-enabled YES -default-test-execution-time-allowance 240 \
              -maximum-test-execution-time-allowance "$gesture_maximum_seconds" \
              "${gesture_test_plan_options[@]}" \
              "${gesture_diagnostic_filters[@]}" \
              ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- \
              2>&1 | tee "$RUNNER_TEMP/$gesture_result_name.log"; then
              gesture_failed=1
            fi
          done
          exit "$gesture_failed"
      - name: Export screenshots
        if: always()
        run: |
          if ! xcrun simctl spawn "$IOS_SIMULATOR_ID" log show --last 45m --style compact \
            --predicate 'subsystem == "com.sheepfarm.next.avatar"' > "$RUNNER_TEMP/avatar-scroll.log" 2>&1; then
            echo "Avatar fixture scroll diagnostics were unavailable; see avatar-scroll.log."
          fi
          if ! xcrun simctl spawn "$IOS_SIMULATOR_ID" log show --last 45m --style compact \
            --predicate 'subsystem == "com.sheepfarm.next.poster"' > "$RUNNER_TEMP/poster-store.log" 2>&1; then
            echo "Poster fixture store diagnostics were unavailable; see poster-store.log."
          fi
          if ! xcrun simctl spawn "$IOS_SIMULATOR_ID" log show --last 45m --style compact \
            --predicate 'subsystem == "com.sheepfarm.next.transcript"' > "$RUNNER_TEMP/transcript-layout.log" 2>&1; then
            echo "Transcript fixture layout diagnostics were unavailable; see transcript-layout.log."
          fi
          if ! xcrun simctl spawn "$IOS_SIMULATOR_ID" log show --last 45m --style compact \
            --predicate 'process == "eSheepNext" OR eventMessage CONTAINS[c] "com.sheepfarm.next.dev"' > "$RUNNER_TEMP/app-runtime.log" 2>&1; then
            echo "App runtime diagnostics were unavailable; see app-runtime.log."
          fi
          python3 - <<'PYCRASH'
          import os, shutil
          from pathlib import Path
          temporary = Path(os.environ['RUNNER_TEMP'])
          marker = temporary / 'compatibility-started'
          if marker.exists():
              started = marker.stat().st_mtime
              device = os.environ.get('IOS_SIMULATOR_ID', '')
              roots = [Path.home() / 'Library/Logs/DiagnosticReports',
                       Path.home() / 'Library/Developer/CoreSimulator/Devices' / device / 'data/Library/Logs/CrashReporter']
              output = temporary / 'compatibility-crash-reports'
              for index, root in enumerate(roots):
                  if not root.exists(): continue
                  for report in root.rglob('*'):
                      if report.is_file() and report.suffix in {'.ips', '.crash'} and 'esheep' in report.name.lower() and report.stat().st_mtime >= started:
                          output.mkdir(exist_ok=True)
                          shutil.copy2(report, output / (str(index) + '-' + report.name))
          PYCRASH
          for gesture_result_name in full-unit gestures native-interactions native-interactions-1 native-interactions-2 native-interactions-3; do
            if [ -d "$RUNNER_TEMP/$gesture_result_name.xcresult" ]; then
              xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/$gesture_result_name.xcresult" > "$RUNNER_TEMP/$gesture_result_name-summary.json"
              xcrun xcresulttool get test-results tests --path "$RUNNER_TEMP/$gesture_result_name.xcresult" > "$RUNNER_TEMP/$gesture_result_name-tests.json"
              xcrun xcresulttool export attachments --path "$RUNNER_TEMP/$gesture_result_name.xcresult" --output-path "$RUNNER_TEMP/gesture-screenshots/$gesture_result_name"
            fi
          done
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          import verify_ios_compatibility as gate
          directory = Path(os.environ['RUNNER_TEMP'])
          scope = os.environ['COMPATIBILITY_SCOPE']
          if scope == 'lifecycle-stability':
              required = tuple('native-interactions-' + str(index) for index in range(1, 4))
              expected_ui_counts = dict.fromkeys(required, 1)
          elif scope == 'avatar-lifecycle':
              required = ('native-interactions',)
              expected_ui_counts = {'native-interactions': 2}
          elif scope == 'full':
              required = ('full-unit', 'gestures', 'native-interactions')
              expected_ui_counts = {'gestures': 1, 'native-interactions': 6}
          elif scope == 'postmerge-ui':
              required = ('native-interactions',)
              expected_ui_counts = {'native-interactions': 10}
          else:
              raise gate.GateError('Unknown validation scope: ' + scope)
          for result in required:
              path = directory / (result + '-summary.json')
              if not path.exists(): raise gate.GateError('Missing required test summary: ' + result)
              summary = json.loads(path.read_text())
              log = directory / (result + '.log')
              skipped = gate.parse_skipped_test_identifiers(log.read_text(errors='replace'))
              gate.validate_summary(summary, allow_fixture_skips=result == 'full-unit',
                                    skipped_test_identifiers=skipped)
              if result in expected_ui_counts and summary['totalTestCount'] != expected_ui_counts[result]:
                  raise gate.GateError('Unexpected UI discovery count for ' + result)
              (directory / (result + '-skipped-tests.json')).write_text(json.dumps([
                  {'identifier': name, 'baselineReason': gate.KNOWN_FULL_UNIT_FIXTURE_SKIPS[name]}
                  for name in sorted(skipped)
              ], indent=2))
          PY
      - name: Separate recordings from screenshots
        if: always()
        run: |
          python3 - <<'PY'
          import os, shutil
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          for path in (root / 'gesture-screenshots').rglob('*'):
              if path.is_file() and path.suffix.lower() not in {'', '.png', '.jpg', '.jpeg', '.json', '.txt'}:
                  destination = root / 'gesture-recordings' / path.relative_to(root / 'gesture-screenshots')
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  shutil.move(path, destination)
          PY
      - name: Preserve focused validation evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: compatibility-gestures-iOS-${{ matrix.runtime }}-${{ matrix.scheme }}-${{ github.sha }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/gesture-build.log
            ${{ runner.temp }}/gestures.log
            ${{ runner.temp }}/full-unit.log
            ${{ runner.temp }}/native-interactions*.log
            ${{ runner.temp }}/avatar-scroll.log
            ${{ runner.temp }}/poster-store.log
            ${{ runner.temp }}/transcript-layout.log
            ${{ runner.temp }}/app-runtime.log
            ${{ runner.temp }}/compatibility-crash-reports
            ${{ runner.temp }}/*-summary.json
            ${{ runner.temp }}/*-tests.json
            ${{ runner.temp }}/*-skipped-tests.json
            ${{ runner.temp }}/runtime-diagnostics-policy.json
            ${{ runner.temp }}/compatibility-validation.json
            ${{ runner.temp }}/gesture-screenshots
      - name: Preserve the actual interaction recordings
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: compatibility-gesture-recordings-iOS-${{ matrix.runtime }}-${{ matrix.scheme }}-${{ github.sha }}
          if-no-files-found: ignore
          path: ${{ runner.temp }}/gesture-recordings
