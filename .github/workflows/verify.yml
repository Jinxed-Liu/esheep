name: Repository verification

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/**'

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install static-check dependencies
        run: sudo apt-get update && sudo apt-get install --yes ripgrep zsh
      - name: Run static gate
        env:
          VERIFY_PUBLIC_CONFIG: '0'
          VERIFY_ALLOW_LEGAL_PLACEHOLDERS: '1'
        run: ./tools/verify_local.sh static

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
          package-manager-cache: true
      - name: Install verification shell dependencies
        run: sudo apt-get update && sudo apt-get install --yes ripgrep zsh
      - name: Install Web dependencies
        working-directory: web
        run: npm ci
      - name: Run Web gate
        run: ./tools/verify_local.sh web

  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            backend/cloudbase-identity-gateway/package-lock.json
            backend/identity-worker/package-lock.json
          package-manager-cache: true
      - name: Install verification shell dependencies
        run: sudo apt-get update && sudo apt-get install --yes ripgrep zsh
      - name: Install backend dependencies
        run: |
          npm ci --prefix backend/cloudbase-identity-gateway
          npm ci --prefix backend/identity-worker
      - name: Run backend gate
        env:
          # Non-production values mirror the fixtures in vitest.config.ts.
          APPLE_CLIENT_ID: com.sheepfarm.next.dev
          APPLE_TEAM_ID: TESTTEAM
          APPLE_KEY_ID: TESTKEY
          APPLE_PRIVATE_KEY: test-only
          SESSION_SIGNING_SECRET: test-session-secret-with-sufficient-entropy
          CREDENTIAL_ENCRYPTION_KEY: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=
          CAPABILITY_SIGNING_PRIVATE_KEY: test-only
          CAPABILITY_SIGNING_KEY_ID: test-key
        run: ./tools/verify_local.sh backend

  database:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: supabase/setup-cli@v3
        with:
          version: 2.114.0
      - name: Install verification shell dependencies
        run: sudo apt-get update && sudo apt-get install --yes ripgrep zsh
      - name: Run disposable local database gate
        env:
          ALLOW_LOCAL_DB_RESET: '1'
        run: ./tools/verify_local.sh db

  # iOS remains a local stable-Xcode release gate until the hosted runner has
  # the exact project-approved Xcode/runtime. CI must not substitute a beta build.
